<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ขอบเขตการปกครอง · React</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>

    <!-- React จาก CDN เพื่อเปิดได้โดยไม่ต้อง build (ในโปรเจกต์จริงใช้ Vite + npm) -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
          "htm": "https://esm.sh/htm@3.1.1"
        }
      }
    </script>

    <link rel="stylesheet" href="../shared/panel.css" />
    <style>
      .layout {
        display: grid;
        grid-template-columns: 300px 1fr;
        height: 100vh;
      }
      .layout .ab-panel {
        position: static;
        width: auto;
        max-height: none;
        height: 100vh;
        border-radius: 0;
        box-shadow: none;
        border-right: 1px solid var(--ab-line);
      }
      .maps {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2px;
        background: var(--ab-line);
        min-height: 0;
      }
      .map-box {
        position: relative;
        min-height: 0;
      }
      .map {
        position: absolute;
        inset: 0;
      }
      .map-tag {
        position: absolute;
        left: 10px;
        top: 10px;
        z-index: 1000;
        padding: 3px 10px;
        border-radius: 999px;
        background: var(--ab-bg);
        color: var(--ab-fg);
        box-shadow: var(--ab-shadow);
        font-size: 12px;
        pointer-events: none;
      }
      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
          grid-template-rows: 70vh auto;
          height: auto;
        }
        .layout .ab-panel {
          order: 2;
          height: auto;
          border-right: 0;
        }
        .maps {
          grid-template-columns: 1fr;
          grid-template-rows: 1fr 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
