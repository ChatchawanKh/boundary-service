<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ขอบเขตการปกครอง · Leaflet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet" />

    <!-- Leaflet + MapLibre + ตัวเชื่อมสองตัวนี้ (ต้องโหลดตามลำดับนี้) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>

    <link rel="stylesheet" href="../shared/panel.css" />
  </head>
  <body>
    <div id="map"></div>
    <div id="panel"></div>

    <script type="module">
      import { bindLeaflet, createBoundaryStore } from "../../src/index.js";
      import { THAILAND_VIEW, dataset } from "../shared/setup.js";
      import { mountPanel } from "../shared/panel.js";

      const store = createBoundaryStore({ persist: { key: "admin-boundary:leaflet" } });

      // แผนที่ Leaflet ปกติ กับ basemap แบบ raster ของคุณเอง
      const map = L.map("map", { zoomControl: false }).setView(
        [THAILAND_VIEW.center[1], THAILAND_VIEW.center[0]],
        Math.round(THAILAND_VIEW.zoom + 1), // ซูม Leaflet (tile 256 px) = ซูม MapLibre + 1
      );
      L.control.zoom({ position: "topright" }).addTo(map);
      L.control.scale({ position: "bottomright" }).addTo(map);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      }).addTo(map);

      // ผูก store: ชั้นขอบเขตถูกวาดด้วย MapLibre ที่ซ้อนอยู่ใน Leaflet
      const boundary = bindLeaflet(map, store, { dataset });

      // marker ของ Leaflet ยังอยู่บนชั้นขอบเขตตามปกติ
      L.marker([13.7563, 100.5018]).addTo(map).bindPopup("อนุสาวรีย์ประชาธิปไตย");

      mountPanel(document.getElementById("panel"), {
        store,
        supports3d: false,
        sdk: "Leaflet 1.9",
      });

      Object.assign(window, { map, store, boundary });
    </script>
  </body>
</html>
